version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, frontend]
    commit-message:
      prefix: chore(deps)
      include: scope
    ignore:
      # Runtime is Node 20 (ci.yml, .nvmrc, engines); keep the type
      # major aligned with it and bump both together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # jsdom >=30 requires Node ^22.22 || ^24.15 || >=26 (pulls undici 8);
      # stays on 29 until the runtime moves off Node 20.
      - dependency-name: "jsdom"
        versions: [">=30"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, ci]
    commit-message:
      prefix: chore(deps)
      include: scope

# Major-version bumps continue to file individual PRs (one per dep)
# so they get individual scrutiny -- that's Dependabot's behaviour
# whenever a `groups` block doesn't include `[major]`.
#
# Security advisories file out-of-band PRs immediately, regardless of
# the weekly schedule. That's the default and is preserved.
